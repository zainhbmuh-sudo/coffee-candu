<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Candu</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #073c3d;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 480px;
    padding: 45px 25px;
    text-align: center;
}

.logo {
    width: 220px;
    max-width: 80%;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.tagline {
    margin: 10px 0 30px;
    opacity: 0.8;
    font-size: 14px;
}

.button {
    display: block;
    background: white;
    color: #073c3d;
    text-decoration: none;
    padding: 18px;
    margin: 14px 0;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
}

.button:active {
    transform: scale(0.98);
}

.icon {
    margin-right: 8px;
}

.footer {
    margin-top: 30px;
    opacity: 0.5;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <img
        class="logo"
        src="logo.png"
        alt="Coffee Candu"
    >

    <h1>Coffee Candu</h1>

    <div class="tagline">
        Kopi yg bikin rindu, yaaa coffee candu
    </div>

    <a
        class="button"
        href="https://wa.me/message/MZE3U2XW7I3UB1"
        target="_blank"
    >
        <span class="icon">💬</span>
        WhatsApp
    </a>

    <a
        class="button"
        href="https://www.instagram.com/coffee.candu_"
        target="_blank"
    >
        <span class="icon">◎</span>
        Instagram
    </a>

    <a
        class="button"
        href="https://maps.app.goo.gl/caihwSmZ99jrqfcF8?g_st=ac"
        target="_blank"
    >
        <span class="icon">📍</span>
        Google Maps
    </a>

    <div class="footer">
        © Coffee Candu
    </div>

</div>

</body>
</html>
